<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 空のグラデーション -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="castleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DDD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景空 -->
  <rect width="800" height="600" fill="url(#skyGradient)"/>
  
  <!-- 雲 -->
  <ellipse cx="150" cy="80" rx="40" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="170" cy="75" rx="35" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="600" cy="120" rx="50" ry="25" fill="white" opacity="0.7"/>
  <ellipse cx="620" cy="115" rx="40" ry="20" fill="white" opacity="0.7"/>
  
  <!-- 山の背景 -->
  <polygon points="0,400 200,300 400,350 600,280 800,320 800,600 0,600" fill="#4A5D23" opacity="0.6"/>
  
  <!-- 城の土台 -->
  <rect x="250" y="450" width="300" height="150" fill="#8B7355" stroke="#654321" stroke-width="2"/>
  
  <!-- メインの城壁 -->
  <rect x="280" y="350" width="240" height="100" fill="url(#castleGradient)" stroke="#999" stroke-width="2"/>
  
  <!-- 城の屋根（メイン） -->
  <polygon points="270,350 530,350 520,320 490,300 460,290 440,285 400,285 360,285 340,290 310,300 280,320" fill="url(#roofGradient)" stroke="#654321" stroke-width="2"/>
  
  <!-- 天守閣 -->
  <rect x="350" y="250" width="100" height="100" fill="url(#castleGradient)" stroke="#999" stroke-width="2"/>
  
  <!-- 天守閣の屋根 -->
  <polygon points="340,250 460,250 450,220 430,200 420,195 400,195 380,195 370,200 350,220" fill="url(#roofGradient)" stroke="#654321" stroke-width="2"/>
  
  <!-- 最上階 -->
  <rect x="370" y="180" width="60" height="70" fill="url(#castleGradient)" stroke="#999" stroke-width="2"/>
  
  <!-- 最上階の屋根 -->
  <polygon points="360,180 440,180 430,150 420,140 415,135 400,135 385,135 380,140 370,150" fill="url(#roofGradient)" stroke="#654321" stroke-width="2"/>
  
  <!-- 窓 -->
  <rect x="290" y="370" width="15" height="20" fill="#333"/>
  <rect x="315" y="370" width="15" height="20" fill="#333"/>
  <rect x="470" y="370" width="15" height="20" fill="#333"/>
  <rect x="495" y="370" width="15" height="20" fill="#333"/>
  
  <rect x="360" y="270" width="12" height="15" fill="#333"/>
  <rect x="380" y="270" width="12" height="15" fill="#333"/>
  <rect x="408" y="270" width="12" height="15" fill="#333"/>
  <rect x="428" y="270" width="12" height="15" fill="#333"/>
  
  <rect x="380" y="200" width="10" height="12" fill="#333"/>
  <rect x="400" y="200" width="10" height="12" fill="#333"/>
  <rect x="410" y="200" width="10" height="12" fill="#333"/>
  
  <!-- 装飾的な要素 -->
  <circle cx="400" cy="160" r="8" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  
  <!-- 桜の木 -->
  <rect x="100" y="480" width="8" height="60" fill="#8B4513"/>
  <circle cx="104" cy="470" r="25" fill="#FFB6C1" opacity="0.8"/>
  <circle cx="96" cy="465" r="20" fill="#FFC0CB" opacity="0.8"/>
  <circle cx="112" cy="460" r="22" fill="#FFB6C1" opacity="0.8"/>
  
  <rect x="650" y="490" width="8" height="50" fill="#8B4513"/>
  <circle cx="654" cy="485" r="20" fill="#FFB6C1" opacity="0.8"/>
  <circle cx="648" cy="480" r="18" fill="#FFC0CB" opacity="0.8"/>
  <circle cx="660" cy="475" r="19" fill="#FFB6C1" opacity="0.8"/>
</svg>
